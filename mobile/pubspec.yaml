name: rider_app
description: RAFTAAR EXPRESS rider app - accept deliveries, capture proof of delivery, and manage COD collections on the go.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Local cache / offline action queue
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.6

  # Location
  geolocator: ^13.0.2

  # Camera / photo capture for proof of delivery
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
